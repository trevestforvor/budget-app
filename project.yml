name: Budget
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  BudgetCore:
    path: Packages/BudgetCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Budget:
    type: application
    platform: iOS
    sources:
      - App
    # The morning summary: APNs (aps-environment in App/Budget.entitlements; Xcode's automatic signing turns development
    # into production for TestFlight and the App Store), and a background refresh that tells the server the phone's time
    # zone after a trip. The entitlements file is chosen in settings below, not generated, so it can depend on
    # BUDGET_API_HOST and BUDGET_FREE_TEAM.
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).morning-summary]
        # The file would otherwise pin 1.0 (1) over MARKETING_VERSION and CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The host Associated Domains were built for (Config/Budget.xcconfig), empty without one: the app offers signing in
        # to a bank again from the phone only when it's set, since a bank's own app can't hand the phone back otherwise.
        BudgetAPIHost: $(BUDGET_API_HOST)
        # YES when built for a free Personal Team (Config/Budget.xcconfig): no push and no Associated Domains, so the app
        # explains the morning summary and pace alerts instead of offering them, and keeps reconnecting on the dashboard.
        BudgetFreeTeam: $(BUDGET_FREE_TEAM_FLAG)
    # Signing comes from Config/Budget.xcconfig, which reads your own team and bundle prefix from Config/Local.xcconfig.
    configFiles:
      Debug: Config/Budget.xcconfig
      Release: Config/Budget.xcconfig
    dependencies:
      - package: BudgetCore
        product: DesignSystem
      - package: BudgetCore
        product: BudgetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUDGET_BUNDLE_PREFIX).budget
        PRODUCT_NAME: Budget
        MARKETING_VERSION: "0.6.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Budget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Budget uses Face ID to unlock your budget when the lock is on.
        INFOPLIST_KEY_NSCameraUsageDescription: Budget reads prices through the camera to show what they cost in hours of work. It's read on your phone and nothing is recorded.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # Config/Budget.xcconfig picks from what Local.xcconfig sets. A paid team: App/Budget.entitlements, or
        # App/BudgetAppLinks.entitlements (the same plus Associated Domains, so Plaid's sign-in comes back to the app from
        # a bank's own app) with BUDGET_API_HOST. A free Personal Team (BUDGET_FREE_TEAM = YES): App/BudgetFree.entitlements,
        # which is empty, since a free team can sign neither push nor Associated Domains.
        CODE_SIGN_ENTITLEMENTS: $(BUDGET_ENTITLEMENTS)
  BudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    configFiles:
      Debug: Config/Budget.xcconfig
      Release: Config/Budget.xcconfig
    dependencies:
      - target: Budget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUDGET_BUNDLE_PREFIX).budget.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Budget
        CODE_SIGN_STYLE: Automatic
schemes:
  Budget:
    build:
      targets:
        Budget: all
    test:
      targets:
        - BudgetUITests
    run:
      config: Debug
